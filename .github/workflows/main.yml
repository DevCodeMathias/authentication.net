name: CI (.NET)

on:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: ["main"]

permissions:
    contents: read
    packages: write
    

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ./API_AUTENTICATION.csproj

      - name: Build
        run: dotnet build ./API_AUTENTICATION.csproj -c Release --no-restore
      
      - name: Publish 
        run: dotnet publish ./API_AUTENTICATION.csproj -c Release -o out --no-build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/api-autentication:latest
            ghcr.io/${{ github.repository_owner }}/api-autentication:${{ github.sha }}

